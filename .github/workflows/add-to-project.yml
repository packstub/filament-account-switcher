name: Add to Plugins board

# New issues and pull requests land on the Plugins project (github.com/users/icaliman/projects/3).
# PROJECTS_TOKEN is a fine-grained personal access token with read and write on Projects, set per repo.

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

permissions: {}

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/users/icaliman/projects/3
          github-token: ${{ secrets.PROJECTS_TOKEN }}
