name: GitHub release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)create the release for, e.g. v1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create release from CHANGELOG.md
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Matches "## 1.2.3 — date" and Keep-a-Changelog "## [1.2.3] - date".
      - name: Extract the changelog section for this tag
        run: |
          version="${TAG#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$version" '
              /^## / { printing = ($0 ~ ("^## \\[?v?" v "(\\]| |$)")) ; next }
              printing { print }
            ' CHANGELOG.md | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
          else
            : > release-notes.md
          fi
          if [ -s release-notes.md ]; then
            echo "Notes from CHANGELOG.md:"; cat release-notes.md
          else
            echo "No \"## $version\" section in CHANGELOG.md; only the merged pull requests go in the notes."
          fi

      # GitHub's list of merged pull requests under the summary (Dependabot is left
      # out by .github/release.yml). The maintainer's own "first contribution" line
      # is dropped, and the New Contributors heading with it when nobody is left.
      - name: Append the merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -q .body \
            | perl -0pe 's/^\* \@icaliman made their first contribution[^\n]*\n//mg; s/^## New Contributors\n+(?=\*\*Full Changelog|\z)//mg' \
            > generated.md
          if [ -s release-notes.md ]; then echo >> release-notes.md; fi
          cat generated.md >> release-notes.md
          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
